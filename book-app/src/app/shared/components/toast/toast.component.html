<div class="toast-container position-fixed top-0 end-0 p-3">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast show mb-2 border-0 shadow" role="alert">
      <div class="toast-body d-flex align-items-center gap-2 rounded text-white"
           [class.bg-success]="toast.type === 'success'"
           [class.bg-danger]="toast.type === 'danger'">
        <i class="fas fa-fw"
           [class.fa-circle-check]="toast.type === 'success'"
           [class.fa-circle-exclamation]="toast.type === 'danger'">
        </i>
        <span class="flex-grow-1">{{ toast.message }}</span>
        <button class="btn-close btn-close-white ms-2" (click)="toastService.dismiss(toast.id)"></button>
      </div>
    </div>
  }
</div>
